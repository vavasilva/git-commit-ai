[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-commit-ai"
version = "0.1.0"
description = "Generate commit messages using local LLMs (Ollama)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Wagner Alexandre" }
]
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
]

[project.scripts]
git-commit-ai = "git_commit_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/git_commit_ai"]
